plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.version
group = project.group

repositories {
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content { includeGroup 'maven.modrinth' }
	}
}

base {
	archivesName = 'dlssmc'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Sodium's config API (the settings page in Video Settings); optional at runtime.
	compileOnly "maven.modrinth:sodium:${project.sodium_version}"

	// ./gradlew runClientGameTest -PtestMods=a.jar,b.jar : extra mods (e.g. Sodium + Vitrail) for compatibility/perf tests.
	if (project.hasProperty('testMods')) {
		localRuntime files(project.property('testMods').split(','))
	}
}

// Automated in-game test (./gradlew runClientGameTest): creates a world and takes comparison screenshots.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "dlssmc-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// -PtestRunFiles=<dir>: copied into the (freshly wiped) game test run directory, e.g. shaderpacks/ + vitrail/pack.txt.
if (project.hasProperty('testRunFiles')) {
	tasks.register('copyTestRunFiles', Copy) {
		from(project.property('testRunFiles'))
		into(layout.projectDirectory.dir('build/run/clientGameTest'))
		mustRunAfter 'deleteGameTestRunDir'
	}
	tasks.named('runClientGameTest') { dependsOn 'copyTestRunFiles' }
}

loom {
	runs.configureEach {
		programArgs "--graphicsBackend", "vulkan"
		// -PtestWindow=2560x1440: initial window size (the game test's resizeWindow loses the device on Windows).
		if (project.hasProperty('testWindow')) {
			def (w, h) = project.property('testWindow').split('x')
			programArgs "--width", w, "--height", h
		}
		// -PtestJvmArgs="-Ddlssmc.skipNgx=true -Ddlssmc.ngxLogging=true": debugging switches for the game test.
		if (project.hasProperty('testJvmArgs')) {
			vmArgs project.property('testJvmArgs').split(' ')
		}
	}
}

// ---------------------------------------------------------------------------
// Native bridge: dlss_bridge.dll (MSVC, links NVIDIA's NGX SDK statically), bundled into the jar under
// /natives/windows-x64 together with NVIDIA's DLSS libraries and AMD's FidelityFX (FSR 3.1) library, which the bridge
// loads at runtime. The SDKs live in _deps (see README).
// ---------------------------------------------------------------------------
def dlssSdk = providers.environmentVariable('DLSS_SDK').orElse(file('_deps/dlss-sdk').absolutePath).get()
def ffxSdk = providers.environmentVariable('FFX_SDK').orElse(file('_deps/ffx-sdk').absolutePath).get()
def nativeOutDir = layout.buildDirectory.dir('native/natives/windows-x64')

tasks.register('buildNative', Exec) {
	inputs.dir('src/native')
	inputs.file('tools/build_native.bat')
	outputs.dir(nativeOutDir)
	commandLine 'cmd', '/c', file('tools/build_native.bat').absolutePath, nativeOutDir.get().asFile.absolutePath
}

tasks.register('copyDlssLibraries', Copy) {
	from("${dlssSdk}/lib/Windows_x86_64/rel") {
		include 'nvngx_dlss.dll', 'nvngx_dlssg.dll'
	}
	from("${ffxSdk}/PrebuiltSignedDLL") {
		include 'amd_fidelityfx_vk.dll'
	}
	into(nativeOutDir)
}

processResources {
	dependsOn 'buildNative', 'copyDlssLibraries'
	from(layout.buildDirectory.dir('native')) {
		include 'natives/**/*.dll'
	}

	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// ./gradlew deployToInstance -Pinstance_mods_dir=<mods folder> (or set it in ~/.gradle/gradle.properties)
tasks.register('deployToInstance', Copy) {
	dependsOn 'build'
	from(tasks.named('jar'))
	into(providers.gradleProperty('instance_mods_dir').orElse(providers.provider {
		throw new GradleException('Set instance_mods_dir to the mods folder to deploy to')
	}))
	doFirst {
		// Remove older builds of this mod from the instance
		fileTree(project.property('instance_mods_dir')).matching { include 'dlssmc-*.jar' }.each { it.delete() }
	}
}
